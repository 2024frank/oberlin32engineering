<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Oberlin 3-2 Engineering Society">
  <!-- The 3-2 ratio, the site's signature: three years at Oberlin solid,
       two at the partner school outlined. Two shapes only, because a favicon
       renders at 16px. The previous mark stacked a circle, a circuit path,
       two dots and 12px text into that space and read as noise. -->
  <rect width="64" height="64" rx="14" fill="#a6192e"/>
  <rect x="8" y="19" width="26.4" height="26" rx="3" fill="#ffffff"/>
  <rect x="39.4" y="20.5" width="16.6" height="23" rx="3" fill="none" stroke="#ffffff" stroke-width="3.4"/>
</svg>
